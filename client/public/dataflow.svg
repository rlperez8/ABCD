<svg width="1800" height="1880" viewBox="0 0 1800 1880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="1880" fill="#0D1117"/>

  <style>
    .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #E6EDF3; }
    .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #9DA7B3; }
    .section { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #E6EDF3; }
    .label { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #E6EDF3; }
    .body { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #B8C1CC; }
    .mono { font: 700 14px Consolas, 'SFMono-Regular', monospace; fill: #D2E5FF; }
    .small { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #9DA7B3; }
    .pill { font: 700 12px 'Segoe UI', Arial, sans-serif; }
    .box { fill: #161B22; stroke: #30363D; stroke-width: 1.5; rx: 18; }
    .source { fill: #111A24; stroke: #58A6FF; stroke-width: 2; rx: 18; }
    .cache { fill: #131F18; stroke: #238636; stroke-width: 2; rx: 18; }
    .ui { fill: #221A10; stroke: #D29922; stroke-width: 2; rx: 18; }
    .raw { fill: #231516; stroke: #DA3633; stroke-width: 2; rx: 18; }
    .arrow { stroke: #58A6FF; stroke-width: 3; stroke-linecap: round; }
    .mutedArrow { stroke: #6E7681; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 8; }
  </style>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58A6FF"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E7681"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1752" height="140" class="box"/>
  <text x="52" y="72" class="title">ABCD Dataflow and Slow Points</text>
  <text x="52" y="104" class="subtitle">This is the full path from raw tables to rollups to API endpoints to the UI. The two biggest slowdowns are raw reads from xabcd_patterns and bulk rollup rebuilds.</text>

  <rect x="52" y="118" width="220" height="28" rx="14" fill="#1D2A38" stroke="#58A6FF"/>
  <text x="71" y="137" class="pill" fill="#9DCCFF">Browser refresh = re-queries</text>
  <rect x="286" y="118" width="255" height="28" rx="14" fill="#2B1B1A" stroke="#DA3633"/>
  <text x="305" y="137" class="pill" fill="#FFB2AA">Rollup refresh = rebuilds tables</text>
  <rect x="555" y="118" width="250" height="28" rx="14" fill="#18241B" stroke="#238636"/>
  <text x="574" y="137" class="pill" fill="#8DDB9D">Caches are fast only when ready</text>

  <text x="52" y="220" class="section">1. Raw Source Tables</text>

  <rect x="52" y="246" width="500" height="160" class="source"/>
  <text x="76" y="280" class="label">candles</text>
  <text x="76" y="307" class="body">Raw OHLCV candle history.</text>
  <text x="76" y="332" class="body">Feeds the chart directly.</text>
  <text x="76" y="357" class="body">Its trend fields later feed strategy buckets.</text>

  <rect x="572" y="246" width="580" height="160" class="source"/>
  <text x="596" y="280" class="label">xabcd_patterns</text>
  <text x="596" y="307" class="body">Main raw table. Every pattern/trade lives here.</text>
  <text x="596" y="332" class="body">Contains harmonic, reversal_type, trade_result, trade_pnl, X/A/B/C lengths, prices, time accuracy inputs, and trend source columns.</text>
  <text x="596" y="357" class="body">Most slow interactive queries and all heavy rebuild jobs eventually touch this table.</text>
  <text x="596" y="385" class="small">This is the center of the whole system.</text>

  <rect x="1172" y="246" width="576" height="160" class="source"/>
  <text x="1196" y="280" class="label">accuracies</text>
  <text x="1196" y="307" class="body">Older helper table used by some legacy accuracy paths.</text>
  <text x="1196" y="332" class="body">Not the main cause of the current slowness.</text>

  <line x1="862" y1="418" x2="862" y2="470" class="arrow" marker-end="url(#arrowBlue)"/>

  <text x="52" y="520" class="section">2. Derived Cache and Rollup Tables</text>

  <rect x="52" y="548" width="400" height="150" class="cache"/>
  <text x="76" y="580" class="label">accuracy_bin_cache</text>
  <text x="76" y="606" class="body">Pre-aggregated accuracy bins.</text>
  <text x="76" y="631" class="body">Used by dashboard accuracy pages when available.</text>

  <rect x="476" y="548" width="400" height="150" class="cache"/>
  <text x="500" y="580" class="label">accuracy_bin_rollup</text>
  <text x="500" y="606" class="body">Yearly rollup of accuracy bins.</text>
  <text x="500" y="631" class="body">Lets accuracy endpoints avoid full raw scans.</text>

  <rect x="900" y="548" width="400" height="150" class="cache"/>
  <text x="924" y="580" class="label">pattern_structure_rollup</text>
  <text x="924" y="606" class="body">Size and balance bucket summary cache.</text>
  <text x="924" y="631" class="body">Used by structure dashboards.</text>

  <rect x="1324" y="548" width="424" height="150" class="cache"/>
  <text x="1348" y="580" class="label">accuracy_structure_rollup</text>
  <text x="1348" y="606" class="body">Accuracy + structure aggregation table.</text>
  <text x="1348" y="631" class="body">Large union-heavy rebuild step.</text>

  <rect x="264" y="730" width="560" height="180" class="cache"/>
  <text x="288" y="764" class="label">strategy_yearly_rollup</text>
  <text x="288" y="791" class="body">Main strategy aggregate table.</text>
  <text x="288" y="817" class="body">One row per cohort per year.</text>
  <text x="288" y="843" class="body">Current cohort dimensions:</text>
  <text x="312" y="868" class="mono">market + harmonic_type + bin + reversal_type + size_bucket</text>
  <text x="312" y="892" class="mono">+ time_bin + three_month_trend + six_month_trend + twelve_month_trend</text>

  <rect x="860" y="730" width="560" height="180" class="cache"/>
  <text x="884" y="764" class="label">strategy_trade_summary_cache</text>
  <text x="884" y="791" class="body">Trade-level cache of patterns already assigned to exact strategy cohorts.</text>
  <text x="884" y="817" class="body">Used to show the trades/examples for a chosen strategy.</text>

  <rect x="610" y="942" width="580" height="128" class="cache"/>
  <text x="634" y="976" class="label">dashboard_cache_state</text>
  <text x="634" y="1003" class="body">Readiness flags for cache families.</text>
  <text x="634" y="1028" class="body">If a cache is not ready, the server can fall back to raw xabcd_patterns queries.</text>

  <line x1="862" y1="1082" x2="862" y2="1136" class="arrow" marker-end="url(#arrowBlue)"/>

  <text x="52" y="1186" class="section">3. API Endpoints and What They Read</text>

  <rect x="52" y="1214" width="820" height="330" class="ui"/>
  <text x="76" y="1248" class="label">Fast or usually-fast paths</text>
  <text x="76" y="1284" class="mono">/strategy-candidates</text>
  <text x="270" y="1284" class="body">reads</text>
  <text x="318" y="1284" class="mono">strategy_yearly_rollup</text>
  <text x="76" y="1312" class="mono">/strategy-trades</text>
  <text x="270" y="1312" class="body">reads</text>
  <text x="318" y="1312" class="mono">strategy_trade_summary_cache</text>
  <text x="76" y="1340" class="mono">/pattern-structure</text>
  <text x="270" y="1340" class="body">tries</text>
  <text x="318" y="1340" class="mono">pattern_structure_rollup</text>
  <text x="76" y="1368" class="mono">/accuracy</text>
  <text x="270" y="1368" class="body">tries</text>
  <text x="318" y="1368" class="mono">accuracy_structure_rollup</text>
  <text x="76" y="1410" class="body">These are only fast when the rollups are ready and the request can stay on the cached path.</text>
  <text x="76" y="1448" class="mono">/setup-comparison</text>
  <text x="270" y="1448" class="body">uses rollup first, raw fallback second</text>
  <text x="76" y="1476" class="body">If the rollup lookup misses or is unavailable, it drops back to raw cohort queries on</text>
  <text x="76" y="1500" class="mono">xabcd_patterns</text>

  <rect x="900" y="1214" width="848" height="330" class="raw"/>
  <text x="924" y="1248" class="label">Current slow interactive paths</text>
  <text x="924" y="1284" class="mono">/pattern-summaries</text>
  <text x="1124" y="1284" class="body">reads raw</text>
  <text x="1194" y="1284" class="mono">xabcd_patterns</text>
  <text x="924" y="1312" class="body">It also computes size_bucket, time_bin, and trend buckets inside the query.</text>
  <text x="924" y="1342" class="body">This is the path used for current setups and some fallback flows.</text>
  <text x="924" y="1384" class="mono">/pattern-reversal</text>
  <text x="1124" y="1384" class="body">also aggregates raw</text>
  <text x="1268" y="1384" class="mono">xabcd_patterns</text>
  <text x="924" y="1426" class="body">Observed local timings during investigation:</text>
  <text x="948" y="1454" class="mono">/pattern-summaries open setups</text>
  <text x="1288" y="1454" class="body">about 19s</text>
  <text x="948" y="1482" class="mono">/strategy-candidates while refresh running</text>
  <text x="1368" y="1482" class="body">about 26s</text>

  <line x1="862" y1="1558" x2="862" y2="1610" class="arrow" marker-end="url(#arrowBlue)"/>

  <text x="52" y="1660" class="section">4. UI Read Path vs Rebuild Path</text>

  <rect x="52" y="1688" width="820" height="150" class="box"/>
  <text x="76" y="1722" class="label">Browser refresh or opening the Strategies page</text>
  <text x="76" y="1750" class="body">This does not rebuild the strategy universe.</text>
  <text x="76" y="1778" class="body">It only re-queries endpoints like strategy candidates, current setups, trades, and comparison data.</text>
  <text x="76" y="1806" class="body">It feels slow because some of those reads still hit raw xabcd_patterns or fall back to raw queries.</text>

  <rect x="900" y="1688" width="848" height="150" class="raw"/>
  <text x="924" y="1722" class="label">Running refresh_structure_rollups</text>
  <text x="924" y="1750" class="body">This is the heavy rebuild job.</text>
  <text x="924" y="1778" class="body">It drops and recreates pattern_structure_rollup, accuracy_structure_rollup, strategy_yearly_rollup, and strategy_trade_summary_cache.</text>
  <text x="924" y="1806" class="body">Then it repopulates them by scanning the full xabcd_patterns table.</text>
</svg>
