[package]
name = "abcd"
version = "0.1.0"
edition = "2021"

[dependencies]
mysql = "25.0"
chrono = { version = "0.4", features = ["serde"] }
tabled = "0.7"
csv = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.6"
rust_decimal = "1.34" 
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "chrono", "rust_decimal"] }
actix-web = "4.0" # Use your appropriate version
dotenvy = "0.15"
